# See README.md for how revisions reach this pipeline and what it ships
# (it runs in the CI image the dispatch pipeline builds: image_from).
# One service's pipeline. The dispatch pipeline registers it once per
# service (orders, payments, …) with SERVICE set; each copy has its own
# history, board and URL, and receives only the revisions the Bazel
# graph says change that service.
type: pipeline
stages:
  - build
  - staging
  - production
jobs:
  # A build checks out the whole tree: Bazel reads MODULE.bazel, .bazelrc,
  # tools/ and every package the service depends on.
  build:
    job_type: build
    stage: build
    timeout_seconds: 1200
    # The CI image the dispatch pipeline built (gcc, Bazel, bazel-diff);
    # build steps come from a shared remote cache (BuildBuddy), so a step
    # any service already ran is fetched, not rebuilt.
    image_from: ../build_ci/ci_image
    # External repositories: downloaded once per MODULE.bazel.lock.
    cache:
      key: bazel-repo-${checksum:MODULE.bazel.lock}
      restore_keys:
        - bazel-repo-
      paths:
        - .cache/bazel-repo
    secrets:
      - BUILDBUDDY_API_KEY
    setup:
      - uses: bazel/remote-cache@1
    script: |
      tools/bazelw test //services/$SERVICE/...
      tools/bazelw build //services/$SERVICE:server_deploy.jar
      mkdir -p dist && cp bazel-bin/services/$SERVICE/server_deploy.jar dist/$SERVICE.jar
    produces:
      jar:
        path: "dist/*.jar"
  # Bazel builds the jar byte for byte: a change that leaves this service's
  # jar identical (a README, a comment, a sibling's code) builds and stops
  # here — the deploys check out only deploy/ and run when the jar they
  # ship is new to them, or when the deploy script changed since they
  # last ran.
  deploy_staging:
    job_type: deploy
    stage: staging
    consumes:
      - build/jar
    checkout:
      - deploy
    script: deploy/deploy.sh $SERVICE staging
  deploy_prod:
    job_type: deploy
    stage: production
    needs:
      - deploy_staging
    consumes:
      - build/jar
    checkout:
      - deploy
    script: deploy/deploy.sh $SERVICE production
