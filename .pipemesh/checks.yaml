# Pull request checks: test every service. No merge base is needed, and
# the checkout stays one commit deep.
type: workflow
stages:
  - image
  - test
jobs:
  # The CI image: ci/ is its whole build context, so it is exactly
  # what is in that directory. An image already built from the same
  # content (this job and ci/) is reused, the default branch's first.
  build_ci:
    job_type: build
    stage: image
    checkout:
      - ci
    script: echo "ci/ changed - building the CI image"
    produces:
      ci_image:
        build: ci

  # A build over the whole tree (the Bazel graph spans it): a revision
  # with the same tree as an earlier pass reuses it. No remote cache: the
  # BuildBuddy key would let proposed code write what the default branch's
  # builds read.
  affected_tests:
    job_type: build
    stage: test
    checkout: true
    # The CI image: a pull request that changes ci/ builds and tests its
    # own; otherwise it runs in the default branch's.
    image_from: build_ci/ci_image
    # External repositories: downloaded once per MODULE.bazel.lock.
    cache:
      key: bazel-repo-${checksum:MODULE.bazel.lock}
      restore_keys:
        - bazel-repo-
      paths:
        - .cache/bazel-repo
    script: |
      tools/bazelw test //services/...
