# A Bazel monorepo on PipeMesh: one dispatch pipeline fans each revision
# out to a pipeline per service, and a service's pipeline receives the
# revision only when the Bazel graph says the change can affect it.
#
# How: the graph job fingerprints every deployable service from Bazel's
# own target hashes (tools/fingerprint.sh, bazel-diff) and produces one
# entry per service. Each dispatch job consumes its service's entry and
# dispatches when it changed since that job last dispatched — so a
# service that sat out ten commits still sees all ten when the next one
# changes it, and a README or an unrelated dependency bump reaches no one.

service: !include .pipemesh/service.yaml

dispatch:
  stages: [graph, dispatch]
  jobs:
    graph:
      stage: graph
      # The CI image carries Bazel, the external repositories and bazel-diff.
      image: ghcr.io/pipemesh/demo-bazel-ci@sha256:e85f80f1b4445d7832de6fa7dbbec1e9311da4968bc3445fe32b36296e59e9e1
      script: |
        tools/fingerprint.sh fingerprints
      produces:
        orders: fingerprints/orders
        payments: fingerprints/payments
        inventory: fingerprints/inventory
        notifications: fingerprints/notifications
        catalog: fingerprints/catalog

    orders:
      stage: dispatch
      consumes: [graph/orders]
      rules: [{ consumed: changed }]
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: orders } }
    payments:
      stage: dispatch
      consumes: [graph/payments]
      rules: [{ consumed: changed }]
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: payments } }
    inventory:
      stage: dispatch
      consumes: [graph/inventory]
      rules: [{ consumed: changed }]
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: inventory } }
    notifications:
      stage: dispatch
      consumes: [graph/notifications]
      rules: [{ consumed: changed }]
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: notifications } }
    catalog:
      stage: dispatch
      consumes: [graph/catalog]
      rules: [{ consumed: changed }]
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: catalog } }

pipemesh:
  pipelines:
    pipeline: !ref dispatch
  workflows:
    checks: { body: !include .pipemesh/checks.yaml, on: pull_request }
    ci_image: { body: !include .pipemesh/ci-image.yaml, on: push }
