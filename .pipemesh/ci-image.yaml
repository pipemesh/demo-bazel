# Builds ghcr.io/pipemesh/demo-bazel-ci when what it bakes in changes.
# The build jobs pin it by digest: after a rebuild, update the digest in
# .pipemesh/service.yaml, .pipemesh/checks.yaml and pipemesh.yaml.
stages: [image]
jobs:
  ci_image:
    stage: image
    rules:
      - changes: [ci/**, .dockerignore, .bazelversion, .bazelrc, MODULE.bazel, MODULE.bazel.lock]
    secrets: [GHCR_TOKEN]
    script: |
      img=ghcr.io/pipemesh/demo-bazel-ci
      for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
      DOCKER_BUILDKIT=1 docker build -f ci/Dockerfile -t "$img:$CI_COMMIT_SHA" .
      echo "$GHCR_TOKEN" | docker login ghcr.io -u pipemesh --password-stdin
      docker push "$img:$CI_COMMIT_SHA"
      echo "pin: $(docker inspect --format '{{index .RepoDigests 0}}' "$img:$CI_COMMIT_SHA")"
