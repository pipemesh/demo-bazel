# One service's pipeline. The dispatch pipeline registers it once per
# service (orders, payments, …) with SERVICE set; each copy has its own
# history, board and URL, and receives only the revisions the Bazel
# graph says change that service.
stages: [build, staging, production]
jobs:
  build:
    stage: build
    script: |
      tools/bazelw test //services/$SERVICE/...
      tools/bazelw build //services/$SERVICE:server_deploy.jar
      mkdir -p dist && cp bazel-bin/services/$SERVICE/server_deploy.jar dist/$SERVICE.jar
    artifacts:
      paths: [dist/]
  deploy_staging:
    stage: staging
    needs: [build]
    script: deploy/deploy.sh $SERVICE staging
  deploy_prod:
    stage: production
    needs: [deploy_staging]   # the jar arrives through this edge
    script: deploy/deploy.sh $SERVICE production
