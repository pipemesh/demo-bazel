# See README.md for how revisions reach this pipeline.
# One service's pipeline. The dispatch pipeline registers it once per
# service (orders, payments, …) with SERVICE set; each copy has its own
# history, board and URL, and receives only the revisions the Bazel
# graph says change that service.
stages: [build, staging, production]
jobs:
  build:
    stage: build
    # Build steps come from a shared remote cache (BuildBuddy): a step any
    # service's build already ran — the libraries they share — is fetched,
    # not rebuilt. Pull requests read it and never write it.
    secrets: [BUILDBUDDY_API_KEY]
    setup:
      - uses: bazel/remote-cache@1
    # What the remote cache does not hold: Bazel itself and the external
    # repositories (JDK, rules), downloaded once and kept between runs.
    cache:
      key: bazel-downloads-${checksum:MODULE.bazel.lock}
      paths: [.bazel-cache]
    script: |
      # Bazel's Java launcher needs a C++ toolchain; the hosted image has none.
      command -v gcc >/dev/null || dnf install -y -q gcc gcc-c++
      export XDG_CACHE_HOME=$PWD/.bazel-cache/xdg
      # Bazel 9 refuses a repo contents cache inside the workspace, and
      # cache: paths live in it: keep the download cache, not that one.
      caches="--repository_cache=$PWD/.bazel-cache/repo --repo_contents_cache="
      tools/bazelw test $caches //services/$SERVICE/...
      tools/bazelw build $caches //services/$SERVICE:server_deploy.jar
      mkdir -p dist && cp bazel-bin/services/$SERVICE/server_deploy.jar dist/$SERVICE.jar
    produces:
      jar: { path: "dist/*.jar" }
  # Bazel builds the jar byte for byte: a change that leaves this service's
  # jar identical (a README, a comment, a sibling's code) builds and stops
  # here — the deploys run when the jar they ship is new to them, or when
  # the deploy script changed since they last ran.
  deploy_staging:
    stage: staging
    consumes: [build/jar]
    rules: [{ consumed: changed }, { changes: [deploy/**] }]
    script: deploy/deploy.sh $SERVICE staging
  deploy_prod:
    stage: production
    needs: [deploy_staging]
    consumes: [build/jar]
    rules: [{ consumed: changed }, { changes: [deploy/**] }]
    script: deploy/deploy.sh $SERVICE production
