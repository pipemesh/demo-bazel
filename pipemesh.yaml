# A Bazel monorepo on Pipemesh: one dispatch pipeline fans each revision
# out to a pipeline per service, and a service's pipeline receives the
# revision only when the Bazel graph says the change can affect it.
#
# How: the graph job fingerprints every deployable service from Bazel's
# own target hashes (the bazel/fingerprint component, bazel-diff) and produces one
# entry per service. Each dispatch job consumes its service's entry and
# dispatches when it changed since that job last dispatched — so a
# service that sat out ten commits still sees all ten when the next one
# changes it, and a README or an unrelated dependency bump reaches no one.
#
# Every job says what it is (kind:) and what it reads (checkout:); the
# kind sets the defaults.

service: !include .pipemesh/service.yaml

dispatch:
  stages: [image, graph, dispatch]
  jobs:
    # The CI image: ci/ is its whole build context, so it is exactly
    # what is in that directory. An image already built from the same
    # content (this job and ci/) is reused instead of built again.
    build_ci:
      kind: build
      stage: image
      checkout: [ci]
      script: echo "ci/ changed - building the CI image"
      publish:
        - { context: ci, key: ci_image }

    # A build that checks out the whole tree: bazel-diff hashes every
    # target, so it reads MODULE.bazel, .bazelrc, tools/ and every package.
    graph:
      kind: build
      stage: graph
      # Every fingerprint also covers the Bazel release and flags, the
      # service pipeline's config and the deploy scripts.
      uses: bazel/fingerprint@1
      image_from: build_ci/ci_image
      # External repositories: downloaded once per MODULE.bazel.lock.
      cache:
        key: bazel-repo-${checksum:MODULE.bazel.lock}
        restore_keys: [bazel-repo-]
        paths: [.cache/bazel-repo]
      with:
        bazel: tools/bazelw
        extra: .bazelversion .bazelrc .pipemesh/service.yaml deploy
      produces:
        orders: fingerprints/orders
        payments: fingerprints/payments
        inventory: fingerprints/inventory
        notifications: fingerprints/notifications
        catalog: fingerprints/catalog

    # One child pipeline per service. A kind: pipeline job checks out
    # nothing, so the entry it consumes is its only input: it hands the
    # revision over only when that entry changed.
    orders:
      kind: pipeline
      stage: dispatch
      consumes: [graph/orders]
      body: !ref service
      variables: { SERVICE: orders }
    payments:
      kind: pipeline
      stage: dispatch
      consumes: [graph/payments]
      body: !ref service
      variables: { SERVICE: payments }
    inventory:
      kind: pipeline
      stage: dispatch
      consumes: [graph/inventory]
      body: !ref service
      variables: { SERVICE: inventory }
    notifications:
      kind: pipeline
      stage: dispatch
      consumes: [graph/notifications]
      body: !ref service
      variables: { SERVICE: notifications }
    catalog:
      kind: pipeline
      stage: dispatch
      consumes: [graph/catalog]
      body: !ref service
      variables: { SERVICE: catalog }

pipemesh:
  pipelines:
    pipeline: !ref dispatch
  workflows:
    checks: { body: !include .pipemesh/checks.yaml, on: pull_request }
